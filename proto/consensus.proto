syntax = "proto3";

package consensus;

option go_package = "./pb";

service RaftNode {
  rpc Propose(Command) returns (ProposeResponse);

  // Phase 4 — a linearizable read. Served by the LEADER: it runs Barrier() +
  // VerifyLeader() and only then reads its own local state machine, which is
  // what makes the answer linearizable rather than merely recent. A follower
  // forwards exactly once (see ReadRequest.forwarded).
  rpc Read(ReadRequest) returns (ReadResponse);

  // The console phase -- this node's own view of the cluster, for the operator
  // console's overview page. Read-only: it touches no log and needs no leader,
  // so EVERY node answers for itself, including its own belief about who leads.
  // That is deliberate: the page polls all three and shows three independent
  // views, and a disagreement between them is the information.
  rpc Status(StatusRequest) returns (StatusResponse);
}

service StateMachine {
  rpc Apply(Command) returns (ApplyResponse);

  // Phase 4 — a plain local read of the C++ store, with no consensus involved.
  // This is deliberately NOT a linearizable read on its own: it is the second
  // half of one, called by the sidecar only after that sidecar has verified it
  // is still the leader. Calling it directly gives you exactly what
  // GET ?consistency=local gives you.
  rpc Get(GetRequest) returns (GetResponse);

  // Phase 3 — raft snapshot lifecycle. The C++ engine owns the state, so it
  // serves both directions: Go asks for a snapshot to hand to raft, and hands
  // a snapshot back when raft restores one.
  //
  // Chunk payloads are the Phase 2 base-file encoding ("KVB1" + length-prefixed
  // records) — one format for disk and wire, so a snapshot is byte-identical to
  // what kv.db would contain.
  rpc GetSnapshot(SnapshotRequest) returns (stream SnapshotChunk);
  rpc RestoreSnapshot(stream SnapshotChunk) returns (RestoreResponse);
}

// Empty today; exists so the request can gain fields (a sequence number, a
// requested format version) without changing the method signature.
message SnapshotRequest {}

message SnapshotChunk {
  bytes data = 1;
}

message RestoreResponse {
  bool success = 1;
  string error = 2;
}

message Command {
  string op = 1;    // "SET", "DELETE"
  string key = 2;
  string value = 3;
  bytes data = 4;   // Serialization wrapper

  // Phase 4 loop guard. Set by a follower when it forwards a proposal to the
  // leader. A request that arrives already-forwarded and still lands on a
  // non-leader is refused with the Phase 1 `not_leader:` error rather than
  // forwarded again, so a stale leader hint cannot produce a forwarding cycle
  // between two nodes that each believe the other leads.
  //
  // New tag. Old binaries never set it, and it is absent from every raft log
  // entry ever written; the apply path ignores it entirely.
  bool forwarded = 5;
}

// Phase 4 linearizable read, sidecar-to-sidecar and C++-to-sidecar.
message ReadRequest {
  string key = 1;
  // Same one-hop guard as Command.forwarded.
  bool forwarded = 2;
}

message ReadResponse {
  bool found = 1;
  // Values are arbitrary bytes (NULs and newlines round-trip since Phase 2),
  // so this is `bytes`, not `string`.
  bytes value = 2;
  // Empty on success. Carries the `not_leader:<addr>` prefix when the read
  // could not be served here, exactly like ProposeResponse.error.
  string error = 3;
}

// Phase 4 local store lookup, Go -> C++.
message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message ProposeResponse {
  bool success = 1;
  string error = 2;
}

message ApplyResponse {
  bool success = 1;
  // Why the apply failed, when success == false. Empty on success.
  // Added in Phase 1: the Go FSM previously discarded this response entirely,
  // so an apply the state machine rejected still looked committed to Raft.
  // New tag — old binaries simply do not set it, and old raft log entries
  // replay unchanged (see .claude/rules/protobuf.md).
  string error = 2;
}

// One member of the committed raft configuration.
message Peer {
  string id = 1;
  string address = 2;
  // "Voter", "Nonvoter" or "Staging", as raft spells it.
  string suffrage = 3;
}

// Empty today; exists so the request can gain fields without changing the
// method signature.
message StatusRequest {}

message StatusResponse {
  string node_id = 1;
  // "Leader", "Follower", "Candidate", "Shutdown" -- raft's own spelling.
  string state = 2;
  uint64 term = 3;
  string leader_id = 4;
  string leader_addr = 5;
  repeated Peer peers = 6;

  uint64 first_log_index = 7;
  uint64 last_log_index = 8;
  uint64 applied_index = 9;
  uint64 commit_index = 10;
  uint64 last_snapshot_index = 11;

  // A PARTIAL failure: the response is otherwise usable but one field could not
  // be read (a failed log-store read, or an unreadable configuration). Empty
  // when everything was read. A total failure is a non-OK gRPC status instead,
  // because there is then nothing truthful to put in the fields.
  string error = 12;
}
