[pytest]
# tests/e2e/conftest.py and test_cluster.py both `from contracts import ...`.
# That resolves under pytest's default "prepend" import mode only because
# tests/e2e has no __init__.py and so gets injected at sys.path[0]. Naming the
# directory explicitly keeps the import working under --import-mode=importlib
# (pytest's recommended mode, and its likely future default).
pythonpath = tests/e2e

testpaths = tests/e2e

markers =
    requires_docker: kills and restarts a container of the local docker compose project (tests/e2e/test_crash.py). Opt in with `-m requires_docker`.

# The suite's standing rule is that tests never start, stop or build anything
# with docker -- the compose lifecycle belongs to the CI e2e job and to the
# cluster-smoke-test skill, and that is what lets `pytest tests/e2e` run against
# any cluster, local or remote. The Phase 2 crash test cannot honor it: proving
# that an acknowledged write survives `kill -9` means sending a real SIGKILL to
# a real container. Deselecting the marker by default keeps the rule true for
# the default invocation instead of quietly abandoning it; run the crash test
# explicitly with:
#
#     pytest tests/e2e -m requires_docker -v
#
# A `-m` on the command line replaces this one (argparse "store", and addopts
# are prepended), so that opt-in works as written.
addopts = -m "not requires_docker"
