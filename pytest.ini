[pytest]
# tests/e2e/conftest.py and test_cluster.py both `from contracts import ...`.
# That resolves under pytest's default "prepend" import mode only because
# tests/e2e has no __init__.py and so gets injected at sys.path[0]. Naming the
# directory explicitly keeps the import working under --import-mode=importlib
# (pytest's recommended mode, and its likely future default).
pythonpath = tests/e2e

testpaths = tests/e2e

markers =
    requires_docker: kills, wipes or restarts a container of the local docker compose project (tests/e2e/test_crash.py, tests/e2e/test_snapshot.py). Opt in with `-m requires_docker`.

# The suite's standing rule is that tests never start, stop or build anything
# with docker -- the compose lifecycle belongs to the CI e2e job and to the
# cluster-smoke-test skill, and that is what lets `pytest tests/e2e` run against
# any cluster, local or remote. Two modules cannot honor it, both for reasons
# that are the requirement rather than a shortcut: the Phase 2 crash test has to
# send a real SIGKILL to a real container, and the Phase 3 snapshot tests have
# to delete a node's volume and start it again. Deselecting the marker by
# default keeps the rule true for the default invocation instead of quietly
# abandoning it; run those tests explicitly with:
#
#     pytest tests/e2e -m requires_docker -v -rs
#
# `-rs` prints skip reasons, which matters here: the snapshot tests skip unless
# the cluster was started with docker-compose.test.yml (aggressive snapshot
# tunables), and a skip nobody can see is an unverified requirement.
#
# A `-m` on the command line replaces this one (argparse "store", and addopts
# are prepended), so that opt-in works as written.
addopts = -m "not requires_docker"
