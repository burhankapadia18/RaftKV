[pytest]
# tests/e2e/conftest.py and test_cluster.py both `from contracts import ...`.
# That resolves under pytest's default "prepend" import mode only because
# tests/e2e has no __init__.py and so gets injected at sys.path[0]. Naming the
# directory explicitly keeps the import working under --import-mode=importlib
# (pytest's recommended mode, and its likely future default).
pythonpath = tests/e2e

testpaths = tests/e2e
